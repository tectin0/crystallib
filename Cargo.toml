[package]
name = "crystallib"
version = "0.2.1"
edition = "2021"
description = "Crystal structures (cell, atoms, values with standard uncertainties), space group symmetry and element data (radii, electronegativities, oxidation states, bond valence parameters)"
license = "GPL-3.0-only AND MIT"
repository = "https://github.com/tectin0/crystallib"
readme = "README.md"
keywords = [
    "crystallography",
    "crystal",
    "space-group",
    "symmetry",
    "chemistry",
]
categories = ["science"]

[package.metadata.docs.rs]
features = ["data", "serde", "symmetry", "get-size"]

[dependencies]
cgmath = "0.18"
log = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
get-size2 = { version = "0.10", features = ["derive"], optional = true }


[features]
data = ["dep:toml", "dep:log"]
# Brown's bond valence table (assets/data/bvparm2020.cif), for non-profit use only: see
# assets/data/bvparm2020-NOTICE.md.
bvparm2020 = ["data"]
serde = ["dep:serde"]
symmetry = ["dep:serde", "dep:serde_json", "dep:log", "cgmath/serde"]
get-size = ["dep:get-size2"]

[dev-dependencies]
gnuplot = "0.0.44"
serde_json = "1.0"
crystallib = { path = ".", features = ["serde", "symmetry", "data"] }
